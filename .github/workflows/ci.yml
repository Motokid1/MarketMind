name: acceptance
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      ADMIN_EMAILS: admin@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r backend/requirements.lock
      - run: cd backend && ruff check app tests && pytest -q
      - run: cd backend && alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: cd frontend && npm ci && npm run test && npm run build && npx playwright install --with-deps chromium
      - run: cd backend && MCP_MODE=mock uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/marketmind.log 2>&1 &
      - run: cd frontend && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: acceptance-evidence, path: frontend/test-results}
