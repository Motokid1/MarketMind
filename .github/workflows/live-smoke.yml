name: explicit-live-mcp-smoke
on: workflow_dispatch
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.lock
      - run: cd backend && alembic upgrade head && python discover.py && python live_smoke.py --live
      - uses: actions/upload-artifact@v4
        with: {name: live-metadata-only, path: backend/docs/live-smoke.json}
